<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Add Complaint</title></head>
<body>
<h1>File a Complaint</h1>
<form th:action="@{/complaints/add}" th:object="${complaint}" method="post">
    <label>Property ID: <input type="number" th:field="*{propertyId}"></label><br><br>
    <label>Tenant ID: <input type="number" th:field="*{tenantId}"></label><br><br>
    <label>Message: <textarea th:field="*{message}"></textarea></label><br><br>
    <label>Status:
        <select th:field="*{status}">
            <option value="pending">pending</option>
            <option value="in progress">in progress</option>
            <option value="resolved">resolved</option>
        </select>
    </label><br><br>
    <button type="submit">Submit Complaint</button>
</form>
</body>
</html>
